<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYATT BD Crm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#050506;
    --panel:#141517;
    --panel-2:#1D1F22;
    --ink:#000000;
    --text:#F1F1ED;
    --ink-soft:#AFB2AC;
    --muted:#83867F;
    --line:#28292C;
    --line-soft:#1C1D20;
    --accent:#FF4B2E;
    --accent-ink:#FF9478;
    --sky:#5C7CFF;
    --violet:#9B6BFF;
    --amber:#F0B429;
    --green:#2ECC81;
    --red:#FF6B52;
    --radius:8px;
    --sidebar-w:236px;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  a{color:inherit;}
  ::selection{background:var(--accent);color:#fff;}

  #app{display:flex;min-height:100vh;}
  .sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--ink);color:#EDEDEA;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px 8px;}
  .brand-mark{width:34px;height:34px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#1a0a06;flex:0 0 34px;}
  .brand-text{line-height:1.15;}
  .brand-text .wordmark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:-0.01em;}
  .brand-text .wordmark span{font-weight:500;color:#AEB2AC;}
  .brand-text .tagline{font-size:11px;color:#8E938E;margin-top:1px;}

  .nav{display:flex;flex-direction:column;gap:1px;margin-top:4px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:#C7CAC3;cursor:pointer;border-left:3px solid transparent;font-size:13px;font-weight:500;transition:background .12s ease, color .12s ease;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.09);color:#fff;border-left-color:var(--accent);}
  .nav-icon{width:16px;height:16px;flex:0 0 16px;display:flex;align-items:center;justify-content:center;}
  .nav-icon svg{width:16px;height:16px;}

  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.09);}
  .quick-add{width:100%;background:var(--accent);color:#fff;border:none;padding:10px 12px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;transition:filter .12s ease;}
  .quick-add:hover{filter:brightness(1.08);}
  .storage-note{font-size:10.5px;color:#767B76;line-height:1.5;padding:0 2px;}

  .main{flex:1;min-width:0;padding:34px 40px 60px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px;}
  .topbar h1{font-size:23px;margin:0 0 4px;letter-spacing:-0.01em;}
  .topbar p{margin:0;color:var(--muted);font-size:13.5px;max-width:560px;}
  .topbar .actions{display:flex;gap:10px;flex:0 0 auto;}

  .btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .12s ease, background .12s ease;}
  .btn:hover{border-color:#45484B;}
  .btn-primary{background:var(--text);color:#0A0A0B;border-color:var(--text);}
  .btn-primary:hover{background:#D8D9D3;}
  .btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-danger{color:var(--red);border-color:var(--line);}
  .btn-danger:hover{border-color:var(--red);background:#2A1512;}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--line-soft);}
  .btn-sm{padding:5px 10px;font-size:12px;}

  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start;}
  .kcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);flex:1 1 240px;min-width:240px;max-width:300px;overflow:hidden;}
  .kcol-head{padding:13px 14px 11px;border-bottom:1px solid var(--line-soft);}
  .kcol-head .stage-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;}
  .stage-dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px;}
  .kcol-head .stage-meta{color:var(--muted);font-size:11.5px;margin-top:4px;}
  .kcol-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px;}
  .kcol-body.dragover{background:var(--line-soft);}
  .kcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;cursor:grab;transition:border-color .12s ease, box-shadow .12s ease;}
  .kcard:hover{border-color:#45484B;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  .kcard.dragging{opacity:.4;}
  .kcard .kc-name{font-weight:600;font-size:13.5px;margin-bottom:2px;}
  .kcard .kc-company{color:var(--muted);font-size:12px;margin-bottom:8px;}
  .kcard .kc-value{font-weight:700;font-size:13px;color:var(--accent-ink);}
  .kcol-empty{color:#7E827C;font-size:12px;text-align:center;padding:20px 8px;border:1px dashed var(--line);border-radius:6px;}

  .view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .view-toggle button{background:var(--panel);border:none;color:var(--muted);padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .view-toggle button.active{background:var(--text);color:#0A0A0B;}
  .view-toggle button+button{border-left:1px solid var(--line);}
  .milestone-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--panel-2);color:var(--ink-soft);margin-top:8px;}
  .milestone-chip.soon{background:#3A2A12;color:var(--amber);}
  .milestone-chip.today{background:#331813;color:var(--red);}
  .hotel-card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .brand-chip{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;}
  .section-divider{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--line-soft);}
  .section-divider:first-child{margin-top:0;padding-top:0;border-top:none;}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .input, .select{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 11px;font-size:13px;color:var(--text);}
  .input:focus, .select:focus, textarea:focus{outline:2px solid var(--sky);outline-offset:1px;}
  .search-wrap{position:relative;flex:1 1 220px;max-width:320px;}
  .search-wrap input{width:100%;padding-left:30px;}
  .search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  thead th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:#1D1F22;}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{cursor:pointer;transition:background .1s ease;}
  tbody tr:hover{background:#1C1E21;}
  .name-cell{font-weight:600;}
  .sub-cell{color:var(--muted);font-size:12px;margin-top:1px;}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid transparent;}
  .pill-dot{width:6px;height:6px;border-radius:50%;}

  .empty-state{text-align:center;padding:70px 20px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);}
  .empty-state h3{color:var(--text);margin:14px 0 6px;font-size:16px;}
  .empty-state p{margin:0 0 16px;font-size:13px;}
  .empty-icon{width:38px;height:38px;margin:0 auto;color:#45484B;}

  .company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .company-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .12s ease;}
  .company-card:hover{border-color:#45484B;}
  .company-card .cc-name{font-weight:700;font-size:15px;margin-bottom:2px;}
  .company-card .cc-industry{color:var(--muted);font-size:12px;margin-bottom:14px;}
  .company-card .cc-stats{display:flex;justify-content:space-between;border-top:1px solid var(--line-soft);padding-top:10px;}
  .company-card .cc-stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:16px;}
  .company-card .cc-stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}

  .backdrop{position:fixed;inset:0;background:rgba(15,17,15,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .panel{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:92vw;background:var(--panel);z-index:41;box-shadow:-8px 0 28px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .2s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
  .panel.open{transform:translateX(0);}
  .panel-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .panel-head h2{font-size:18px;margin:0 0 4px;}
  .panel-head .ph-sub{color:var(--muted);font-size:12.5px;}
  .panel-close{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:4px;}
  .panel-close:hover{background:var(--line-soft);color:var(--text);}
  .panel-body{padding:20px 22px;overflow-y:auto;flex:1;}
  .panel-actions{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;}

  .field-group{margin-bottom:18px;}
  .field-group .fg-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;font-weight:600;}
  .field-group .fg-value{font-size:14px;}
  .field-group .fg-value a{color:var(--sky);text-decoration:none;}
  .field-group .fg-value a:hover{text-decoration:underline;}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .tag{background:var(--line-soft);border:1px solid var(--line);padding:2px 9px;border-radius:20px;font-size:11.5px;color:var(--ink-soft);}
  .stage-select-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .stage-btn{border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .stage-btn.current{color:#fff;border-color:transparent;}

  .assoc-list{display:flex;flex-direction:column;gap:8px;}
  .assoc-item{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .assoc-item:hover{border-color:#45484B;}
  .assoc-item .ai-name{font-weight:600;font-size:13px;}
  .assoc-item .ai-sub{color:var(--muted);font-size:11.5px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(15,17,15,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .modal{background:var(--panel);border-radius:10px;width:480px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto;}
  .modal.wide{width:640px;}
  .dropzone{border:1px dashed var(--line);border-radius:8px;padding:28px 18px;text-align:center;color:var(--muted);font-size:12.5px;}
  .dropzone input[type=file]{margin-top:10px;font-size:12.5px;color:var(--text);}
  .map-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:10px;}
  .map-row label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .map-row select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);font-size:12.5px;}
  .import-preview{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:14px;}
  .import-preview table{border:none;border-radius:0;}
  .import-preview th, .import-preview td{padding:8px 10px;font-size:12px;}
  .import-summary{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:16px;font-size:13px;line-height:1.7;}
  .import-summary b{color:var(--text);}
  .modal-head{padding:20px 24px 4px;}
  .modal-head h2{font-size:17px;margin:0;}
  .modal-body{padding:16px 24px 22px;}
  .form-row{margin-bottom:14px;}
  .form-row label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .form-row input, .form-row select, .form-row textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;}
  .form-row textarea{resize:vertical;min-height:64px;}
  .form-row.checkbox-row{display:flex;align-items:center;gap:8px;}
  .form-row.checkbox-row label{margin:0;}
  .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-foot{padding:14px 24px 22px;display:flex;justify-content:flex-end;gap:8px;}
  .required-mark{color:var(--accent);}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .stat-card .sc-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
  .stat-card .sc-value{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.01em;}
  .stat-card .sc-sub{font-size:12px;color:var(--muted);margin-top:4px;}

  .analytics-section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;}
  .analytics-section h3{font-size:14px;margin:0 0 16px;}
  .funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .funnel-row:last-child{margin-bottom:0;}
  .funnel-label{width:120px;flex:0 0 120px;font-size:12.5px;font-weight:600;}
  .funnel-track{flex:1;background:var(--line-soft);border-radius:4px;height:22px;position:relative;overflow:hidden;}
  .funnel-fill{height:100%;border-radius:4px;transition:width .3s ease;}
  .funnel-count{width:104px;flex:0 0 104px;text-align:right;font-size:12.5px;color:var(--muted);}
  .funnel-count b{color:var(--text);font-weight:700;}

  .split-bar{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line);}
  .split-bar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
  @media (max-width:920px){.two-col{grid-template-columns:1fr;}}

  .cbar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .cbar-row:last-child{margin-bottom:0;}
  .cbar-label{width:110px;flex:0 0 110px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cbar-track{flex:1;background:var(--line-soft);border-radius:4px;height:16px;}
  .cbar-fill{height:100%;border-radius:4px;background:var(--sky);}
  .cbar-value{flex:0 0 76px;text-align:right;font-size:12px;color:var(--muted);}

  .loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--muted);font-size:13px;}

  /* calendar */
  .calendar-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
  .cal-toolbar h3{margin:0;font-size:15px;}
  .cal-nav{display:flex;gap:6px;align-items:center;}
  .cal-nav button{border:1px solid var(--line);background:var(--panel);width:28px;height:28px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
  .cal-nav button:hover{border-color:#45484B;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);}
  .cal-weekdays div{padding:8px;text-align:center;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-cell{min-height:92px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:6px;cursor:pointer;transition:background .1s ease;}
  .cal-cell:hover{background:#1C1E21;}
  .cal-cell.other-month{background:#101113;color:#C7CAC3;cursor:default;}
  .cal-daynum{font-size:12px;font-weight:600;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:5px;margin-bottom:4px;}
  .cal-cell.today .cal-daynum{background:var(--accent);color:#fff;}
  .cal-chip{font-size:10.5px;background:var(--line-soft);border-radius:4px;padding:2px 5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-more{font-size:10px;color:var(--muted);}

  .toggle{position:relative;width:38px;height:22px;border-radius:20px;background:var(--line);border:none;cursor:pointer;flex:0 0 38px;padding:0;}
  .toggle.on{background:var(--green);}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s ease;}
  .toggle.on::after{transform:translateX(16px);}

  .workflow-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px;}
  .workflow-card .wf-name{font-weight:700;font-size:14px;margin-bottom:4px;}
  .workflow-card .wf-flow{font-size:12.5px;color:var(--muted);}
  .workflow-card .wf-flow b{color:var(--ink-soft);font-weight:600;}
  .workflow-actions{display:flex;gap:8px;align-items:center;}

  .seq-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .seq-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .seq-name{font-weight:700;font-size:14.5px;}
  .seq-desc{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .seq-steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;}
  .seq-step-chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:600;}
  .seq-step-chip svg{width:12px;height:12px;}
  .seq-arrow{color:var(--muted);font-size:12px;}
  .seq-meta{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);}
  .step-editor-row{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
  .step-editor-row .se-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .se-num{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .se-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;}
  .se-remove:hover{color:var(--red);}
  .overdue{color:var(--red);font-weight:700;}
  .due-today{color:var(--amber);font-weight:700;}

  .conv-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .conv-item:last-child{border-bottom:none;}

  /* ---- CSV helpers ---- */
  function parseCSV(text){
    var rows = []; var row = []; var field = ''; var inQuotes = false;
    text = text.replace(/^\uFEFF/, ''); // strip BOM if present
    for(var i=0;i<text.length;i++){
      var ch = text[i];
      if(inQuotes){
        if(ch === '"'){
          if(text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += ch;
      } else {
        if(ch === '"') inQuotes = true;
        else if(ch === ','){ row.push(field); field = ''; }
        else if(ch === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else if(ch === '\r'){ /* ignore, \n handles the break */ }
        else field += ch;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(function(r){ return !(r.length === 1 && r[0].trim() === ''); });
  }
  function normalizeHeader(h){ return String(h||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
  function guessImportMapping(headers, fieldDefs){
    var mapping = {}; var used = {};
    fieldDefs.forEach(function(fd){
      var found = -1;
      for(var i=0;i<headers.length;i++){
        if(used[i]) continue;
        var norm = normalizeHeader(headers[i]);
        var hit = fd.guesses.some(function(g){ var ng = normalizeHeader(g); return norm === ng || norm.indexOf(ng) !== -1 || ng.indexOf(norm) !== -1; });
        if(hit){ found = i; break; }
      }
      mapping[fd.key] = found;
      if(found !== -1) used[found] = true;
    });
    return mapping;
  }

      {key:'import', label:'Import', icon:'importIcon'},
      {key:'settings', label:'Settings', icon:'settings'}
    ];
    var navHtml = items.map(function(it){
      return '<div class="nav-item ' + (state.tab === it.key ? 'active' : '') + '" data-action="go-tab" data-tab="' + it.key + '">' +
        '<span class="nav-icon">' + navIcon(it.icon) + '</span><span>' + it.label + '</span></div>';
    }).join('');

    return '' +
    '<div class="sidebar">' +
      '<div class="brand">' +
        '<div class="brand-mark">H</div>' +
        '<div class="brand-text"><div class="wordmark">HYATT<span> BD</span></div><div class="tagline">Crm</div></div>' +
      '</div>' +
      '<div class="nav">' + navHtml + '</div>' +
      '<div class="sidebar-footer">' +
        '<button class="quick-add" data-action="open-contact-modal">+ New Lead</button>' +
        '<div class="storage-note">Data is saved privately to your account and stays put between visits.</div>' +
      '</div>' +
    '</div>';
  }

  /* ===================== main dispatch ===================== */
  function renderMain(){
    if(state.tab === 'pipeline') return renderPipelineTab();
    if(state.tab === 'hotels') return renderHotelsTab();
    if(state.tab === 'contacts') return renderContactsTab();
    if(state.tab === 'companies') return renderCompaniesTab();
    if(state.tab === 'analytics') return renderAnalyticsTab();
    if(state.tab === 'calendar') return renderCalendarTab();
    if(state.tab === 'meetings') return renderMeetingsTab();
    if(state.tab === 'timetracking') return renderTimeTrackingTab();
    if(state.tab === 'opportunities') return renderOpportunitiesTab();
    if(state.tab === 'conversations') return renderConversationsTab();
    if(state.tab === 'workflows') return renderWorkflowsTab();
    if(state.tab === 'sequences') return renderSequencesTab();
    if(state.tab === 'settings') return renderSettingsTab();
    if(state.tab === 'import') return renderImportTab();
    return '';
  }

  function emptyState(icon, title, desc, action, actionLabel){
    var icons = {
      contacts: '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>',
      companies: '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M9 8h1M9 12h1M9 16h1M14 8h1M14 12h1M14 16h1"/></svg>',
      search: '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
      generic: '<svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>'
    };
    return '<div class="empty-state">' + (icons[icon]||icons.generic) +
      '<h3>' + title + '</h3><p>' + desc + '</p>' +
      (action ? '<button class="btn btn-primary" data-action="' + action + '">' + actionLabel + '</button>' : '') +
    '</div>';
  }

  /* ===================== pipeline tab ===================== */
  function renderPipelineTab(){
    var lost = state.contacts.filter(function(c){ return c.isLost; });
    var cols = STAGES.map(function(stage){
      var leads = state.contacts.filter(function(c){ return c.stage === stage.key && !c.isLost; });
      var total = leads.reduce(function(sum,c){ return sum + (Number(c.dealValue)||0); }, 0);
      var cardsHtml = leads.length
        ? leads.map(function(c){
            var comp = companyById(c.companyId);
            return '<div class="kcard" draggable="true" data-id="' + c.id + '" data-action="open-contact-panel">' +
              '<div class="kc-name">' + escapeHtml(c.name) + '</div>' +
              '<div class="kc-company">' + (comp ? escapeHtml(comp.name) : 'No company') + '</div>' +
              '<div class="kc-value">' + fmtMoney(c.dealValue) + '</div>' +
            '</div>';
          }).join('')
        : '<div class="kcol-empty">No leads here yet</div>';

      return '<div class="kcol" data-stage="' + stage.key + '">' +
        '<div class="kcol-head" style="border-top:3px solid ' + stage.color + '">' +
          '<div class="stage-name"><span class="stage-dot" style="background:' + stage.color + '"></span>' + stage.label + '</div>' +
          '<div class="stage-meta">' + leads.length + ' lead' + (leads.length===1?'':'s') + ' · ' + fmtMoney(total) + '</div>' +
        '</div>' +
        '<div class="kcol-body" data-stage="' + stage.key + '">' + cardsHtml + '</div>' +
      '</div>';
    }).join('');

    var totalActive = state.contacts.filter(function(c){ return !c.isLost && !isFinalStage(c.stage); }).length;
    var lostNote = lost.length
      ? '<span class="btn btn-ghost btn-sm" data-action="go-tab" data-tab="contacts" style="margin-left:auto;">' + lost.length + ' lost lead' + (lost.length===1?'':'s') + ' — view in Contacts</span>'
      : '';

    return '' +
    '<div class="topbar">' +
      '<div><h1>Lead Pipeline</h1><p>Drag a card between columns as a lead moves forward. ' + totalActive + ' active lead' + (totalActive===1?'':'s') + ' in motion right now.</p></div>' +
      '<div class="actions">' + lostNote + '<button class="btn btn-accent" data-action="open-contact-modal">+ New Lead</button></div>' +
    '</div>' +
    '<div class="kanban">' + cols + '</div>';
  }

  /* ===================== hotel pipeline tracker tab ===================== */
  function buildTypeBadge(key){
    var b = BUILD_TYPE_MAP[key] || BUILD_TYPES[0];
    return '<span class="pill" style="background:' + b.color + '18;color:' + b.color + ';border-color:' + b.color + '33;"><span class="pill-dot" style="background:' + b.color + '"></span>' + b.label + '</span>';
  }
  function milestoneChip(h){
    var m = nextHotelMilestone(h);
    if(!m){
      var phase = computeHotelPhase(h);
      return phase === 'established' ? '<span class="milestone-chip">Fully established</span>' : '';
    }
    var cls = m.days === 0 ? 'today' : (m.days <= 7 ? 'soon' : '');
    var text = m.days === 0 ? m.label + ' — today' : m.label + ' in ' + m.days + 'd';
    return '<span class="milestone-chip ' + cls + '">' + text + '</span>';
  }

  function filteredHotels(){
    var q = state.hotelSearch.trim().toLowerCase();
    return state.hotels.filter(function(h){
      if(state.hotelBrandFilter !== 'all' && h.brand !== state.hotelBrandFilter) return false;
      if(state.hotelBuildFilter !== 'all' && h.buildType !== state.hotelBuildFilter) return false;
      if(!q) return true;
      var hay = (h.propertyCode + ' ' + h.name + ' ' + h.brand + ' ' + h.country + ' ' + h.state + ' ' + h.bdm1 + ' ' + h.bdm2).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function renderHotelsTab(){
    var all = state.hotels;
    var list = filteredHotels();
    var newBuilds = all.filter(function(h){ return h.buildType === 'new'; }).length;
    var conversions = all.filter(function(h){ return h.buildType === 'conversion'; }).length;
    var selling = all.filter(function(h){ return computeHotelPhase(h) === 'selling'; }).length;
    var trippingSoon = all.filter(function(h){
      var m = nextHotelMilestone(h);
      return m && m.days <= 30 && (m.label.indexOf('engagement') !== -1);
    }).length;

    var statCards = '' +
      '<div class="stat-card"><div class="sc-label">Total properties</div><div class="sc-value">' + all.length + '</div><div class="sc-sub">' + newBuilds + ' new build · ' + conversions + ' conversion</div></div>' +
      '<div class="stat-card"><div class="sc-label">Pre-opening now</div><div class="sc-value">' + selling + '</div><div class="sc-sub">Actively selling</div></div>' +
      '<div class="stat-card"><div class="sc-label">Market trips in 30 days</div><div class="sc-value">' + trippingSoon + '</div><div class="sc-sub">Upcoming engagement travel</div></div>' +
      '<div class="stat-card"><div class="sc-label">Established</div><div class="sc-value">' + all.filter(function(h){ return computeHotelPhase(h)==='established'; }).length + '</div><div class="sc-sub">90+ days post-open</div></div>';

    var brandOptions = '<option value="all">All brands</option>' + HOTEL_BRANDS.map(function(b){
      return '<option value="' + escapeHtml(b) + '"' + (state.hotelBrandFilter===b?' selected':'') + '>' + escapeHtml(b) + '</option>';
    }).join('');
    var buildOptions = '<option value="all">All build types</option>' + BUILD_TYPES.map(function(b){
      return '<option value="' + b.key + '"' + (state.hotelBuildFilter===b.key?' selected':'') + '>' + b.label + '</option>';
    }).join('');

    var body;
    if(all.length === 0){
      body = emptyState('generic', 'No properties yet', 'Add a hotel to start tracking it from assignment through opening and post-open check-ins.', 'open-hotel-modal', '+ New Property');
    } else if(list.length === 0){
      body = emptyState('search', 'No matches', 'Try a different search term or filter.', null, null);
    } else if(state.hotelView === 'table'){
      var rows = list.map(function(h){
        var m = nextHotelMilestone(h);
        return '<tr data-action="open-hotel-modal" data-id="' + h.id + '">' +
          '<td><div class="name-cell">' + escapeHtml(h.propertyCode||'—') + '</div></td>' +
          '<td><div class="name-cell">' + escapeHtml(h.name) + '</div><div class="sub-cell">' + escapeHtml(h.brand||'') + '</div></td>' +
          '<td>' + escapeHtml([h.state, h.country].filter(Boolean).join(', ') || '—') + '</td>' +
          '<td>' + buildTypeBadge(h.buildType) + '</td>' +
          '<td>' + (function(){ var p=HOTEL_PHASE_MAP[computeHotelPhase(h)]; return '<span class="pill" style="background:'+p.color+'18;color:'+p.color+';border-color:'+p.color+'33;"><span class="pill-dot" style="background:'+p.color+'"></span>'+p.label+'</span>'; })() + '</td>' +
          '<td>' + escapeHtml(h.bdm1||'—') + '</td>' +
          '<td style="color:var(--muted)">' + (m ? m.label + ' · ' + fmtDate(m.date) : '—') + '</td>' +
        '</tr>';
      }).join('');
      body = '<table><thead><tr><th>Code</th><th>Property</th><th>Location</th><th>Build type</th><th>Phase</th><th>BDM</th><th>Next milestone</th></tr></thead><tbody>' + rows + '</tbody></table>';
    } else {
      var cols = HOTEL_PHASES.map(function(phase){
        var props = list.filter(function(h){ return computeHotelPhase(h) === phase.key; });
        var cardsHtml = props.length ? props.map(function(h){
          return '<div class="kcard" data-action="open-hotel-modal" data-id="' + h.id + '">' +
            '<div class="kc-name">' + escapeHtml(h.name) + '</div>' +
            '<div class="kc-company">' + escapeHtml(h.propertyCode||'No code') + (h.state||h.country ? ' · ' + escapeHtml([h.state,h.country].filter(Boolean).join(', ')) : '') + '</div>' +
            '<div class="hotel-card-meta">' + buildTypeBadge(h.buildType) + (h.brand ? '<span class="brand-chip">' + escapeHtml(h.brand) + '</span>' : '') + '</div>' +
            (h.bdm1 ? '<div class="kc-company" style="margin-top:6px;">BDM: ' + escapeHtml(h.bdm1) + '</div>' : '') +
            milestoneChip(h) +
          '</div>';
        }).join('') : '<div class="kcol-empty">No properties in this phase</div>';

        return '<div class="kcol" data-phase="' + phase.key + '">' +
          '<div class="kcol-head" style="border-top:3px solid ' + phase.color + '">' +
            '<div class="stage-name"><span class="stage-dot" style="background:' + phase.color + '"></span>' + phase.label + '</div>' +
            '<div class="stage-meta">' + props.length + ' propert' + (props.length===1?'y':'ies') + '</div>' +
          '</div>' +
          '<div class="kcol-body">' + cardsHtml + '</div>' +
        '</div>';
      }).join('');
      body = '<div class="kanban">' + cols + '</div>';
    }

    return '' +
    '<div class="topbar">' +
      '<div><h1>Hotel Pipeline</h1><p>Every property from assignment through opening — phase and next milestone are calculated automatically from its dates.</p></div>' +
      '<div class="actions"><button class="btn" data-action="open-import-hotels">Import File</button><button class="btn btn-accent" data-action="open-hotel-modal">+ New Property</button></div>' +
    '</div>' +
    '<div class="stat-grid">' + statCards + '</div>' +
    '<div class="toolbar">' +
      '<div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
      '<input class="input" id="hotel-search" placeholder="Search code, property, BDM…" value="' + escapeHtml(state.hotelSearch) + '"></div>' +
      '<select class="select" id="hotel-brand-filter">' + brandOptions + '</select>' +
      '<select class="select" id="hotel-build-filter">' + buildOptions + '</select>' +
      '<div class="view-toggle" style="margin-left:auto;">' +
        '<button class="' + (state.hotelView==='board'?'active':'') + '" data-action="set-hotel-view" data-view="board">Board</button>' +
        '<button class="' + (state.hotelView==='table'?'active':'') + '" data-action="set-hotel-view" data-view="table">Table</button>' +
      '</div>' +
    '</div>' +
    body;
  }

  function filteredContacts(){
    var q = state.contactSearch.trim().toLowerCase();
    return state.contacts.filter(function(c){
      if(state.contactFilter === 'lost' && !c.isLost) return false;
      if(state.contactFilter !== 'all' && state.contactFilter !== 'lost'){
        if(c.isLost || c.stage !== state.contactFilter) return false;
      }
      if(!q) return true;
      var comp = companyById(c.companyId);
      var hay = (c.name + ' ' + (c.email||'') + ' ' + (comp ? comp.name : '')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function stagePill(c){
    if(c.isLost){
      return '<span class="pill" style="background:#331813;color:#FF6B52;border-color:#4A241D;"><span class="pill-dot" style="background:#FF6B52"></span>Lost</span>';
    }
    var s = STAGE_MAP[c.stage] || STAGES[0];
    return '<span class="pill" style="background:' + s.color + '18;color:' + s.color + ';border-color:' + s.color + '33;"><span class="pill-dot" style="background:' + s.color + '"></span>' + s.label + '</span>';
  }

  function renderContactsTab(){
    var list = filteredContacts();
    var filterOptions = '<option value="all">All leads</option>' +
      STAGES.map(function(s){ return '<option value="' + s.key + '"' + (state.contactFilter===s.key?' selected':'') + '>' + s.label + '</option>'; }).join('') +
      '<option value="lost"' + (state.contactFilter==='lost'?' selected':'') + '>Lost</option>';

    var body;
    if(state.contacts.length === 0){
      body = emptyState('contacts', 'No contacts yet', "Add your first lead to start building the pipeline.", 'open-contact-modal', '+ New Lead');
    } else if(list.length === 0){
      body = emptyState('search', 'No matches', 'Try a different search term or filter.', null, null);
    } else {
      var rows = list.map(function(c){
        var comp = companyById(c.companyId);
        return '<tr data-action="open-contact-panel" data-id="' + c.id + '">' +
          '<td><div class="name-cell">' + escapeHtml(c.name) + '</div><div class="sub-cell">' + escapeHtml(c.title || '') + '</div></td>' +
          '<td>' + (comp ? escapeHtml(comp.name) : '<span style="color:var(--muted)">—</span>') + '</td>' +
          '<td>' + stagePill(c) + '</td>' +
          '<td>' + fmtMoney(c.dealValue) + '</td>' +
          '<td style="color:var(--muted)">' + fmtDate(c.createdAt) + '</td>' +
        '</tr>';
      }).join('');
      body = '<table><thead><tr><th>Name</th><th>Company</th><th>Stage</th><th>Deal value</th><th>Added</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    return '' +
    '<div class="topbar">' +
      '<div><h1>Contacts</h1><p>Every lead and connection your agency is tracking, in one place.</p></div>' +
      '<div class="actions"><button class="btn" data-action="go-tab" data-tab="import">Import File</button><button class="btn btn-accent" data-action="open-contact-modal">+ New Lead</button></div>' +
    '</div>' +
    '<div class="toolbar">' +
      '<div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
      '<input class="input" id="contact-search" placeholder="Search name, email, or company" value="' + escapeHtml(state.contactSearch) + '"></div>' +
      '<select class="select" id="contact-filter">' + filterOptions + '</select>' +
    '</div>' +
    body;
  }

  /* ===================== companies tab (linked from contact/company panels) ===================== */
  function renderCompaniesTab(){
    var q = state.companySearch.trim().toLowerCase();
    var list = state.companies.filter(function(c){ return !q || c.name.toLowerCase().indexOf(q) !== -1; });

    var body;
    if(state.companies.length === 0){
      body = emptyState('companies', 'No companies yet', 'Add a company profile to start grouping your leads by client.', 'open-company-modal', '+ New Company');
    } else if(list.length === 0){
      body = emptyState('search', 'No matches', 'Try a different search term.', null, null);
    } else {
      var cards = list.map(function(co){
        var leads = contactsForCompany(co.id);
        var value = leads.filter(function(c){ return !c.isLost; }).reduce(function(s,c){ return s + (Number(c.dealValue)||0); }, 0);
        return '<div class="company-card" data-action="open-company-panel" data-id="' + co.id + '">' +
          '<div class="cc-name">' + escapeHtml(co.name) + '</div>' +
          '<div class="cc-industry">' + escapeHtml(co.industry || 'No industry set') + '</div>' +
          '<div class="cc-stats">' +
            '<div class="cc-stat"><b>' + leads.length + '</b><span>Contact' + (leads.length===1?'':'s') + '</span></div>' +
            '<div class="cc-stat"><b>' + fmtMoney(value) + '</b><span>Pipeline value</span></div>' +
          '</div>' +
        '</div>';
      }).join('');
      body = '<div class="company-grid">' + cards + '</div>';
    }

    return '' +
    '<div class="topbar">' +
      '<div><h1>Companies</h1><p>Client and prospect organizations behind your leads.</p></div>' +
      '<div class="actions"><button class="btn btn-accent" data-action="open-company-modal">+ New Company</button></div>' +
    '</div>' +
    '<div class="toolbar"><div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
    '<input class="input" id="company-search" placeholder="Search companies" value="' + escapeHtml(state.companySearch) + '"></div></div>' +
    body;
  }

  /* ===================== analytics tab ===================== */
  function renderAnalyticsTab(){
    var all = state.contacts;
    var lost = all.filter(function(c){ return c.isLost; });
    var won = all.filter(function(c){ return isFinalStage(c.stage) && !c.isLost; });
    var active = all.filter(function(c){ return !isFinalStage(c.stage) && !c.isLost; });
    var pipelineValue = active.reduce(function(s,c){ return s + (Number(c.dealValue)||0); }, 0);
    var wonValue = won.reduce(function(s,c){ return s + (Number(c.dealValue)||0); }, 0);
    var closedTotal = won.length + lost.length;
    var winRate = closedTotal ? Math.round((won.length / closedTotal) * 100) : null;
    var avgDeal = won.length ? Math.round(wonValue / won.length) : 0;

    var statCards = [
      {label:'Total leads', value: all.length, sub: active.length + ' currently active'},
      {label:'Open pipeline value', value: fmtMoney(pipelineValue), sub: active.length + ' active deal' + (active.length===1?'':'s')},
      {label:'Accounts sent to AE', value: won.length, sub: fmtMoney(wonValue) + ' total value'},
      {label:'Win rate', value: winRate === null ? '—' : winRate + '%', sub: closedTotal ? (won.length + ' sent / ' + lost.length + ' lost') : 'No closed deals yet'}
    ].map(function(s){
      return '<div class="stat-card"><div class="sc-label">' + s.label + '</div><div class="sc-value">' + s.value + '</div><div class="sc-sub">' + s.sub + '</div></div>';
    }).join('');

    var maxCount = Math.max.apply(null, STAGES.map(function(s){
      return all.filter(function(c){ return c.stage===s.key && !c.isLost; }).length;
    }).concat([1]));
    var funnelRows = STAGES.map(function(s){
      var stageLeads = all.filter(function(c){ return c.stage===s.key && !c.isLost; });
      var count = stageLeads.length;
      var value = stageLeads.reduce(function(sum,c){ return sum + (Number(c.dealValue)||0); }, 0);
      var pct = maxCount ? Math.max((count / maxCount) * 100, count ? 6 : 0) : 0;
      return '<div class="funnel-row">' +
        '<div class="funnel-label">' + s.label + '</div>' +
        '<div class="funnel-track"><div class="funnel-fill" style="width:' + pct + '%;background:' + s.color + '"></div></div>' +
        '<div class="funnel-count"><b>' + count + '</b> · ' + fmtMoney(value) + '</div>' +
      '</div>';
    }).join('');

    var splitHtml;
    if(closedTotal === 0){
      splitHtml = '<p style="color:var(--muted);font-size:12.5px;margin:0;">No deals have closed yet — this will fill in once leads are sent to AE or get marked Lost.</p>';
    } else {
      var wonPct = Math.round((won.length/closedTotal)*100);
      splitHtml = '<div class="split-bar">' +
        (won.length ? '<div style="width:' + wonPct + '%;background:var(--green);">' + won.length + ' sent to AE</div>' : '') +
        (lost.length ? '<div style="width:' + (100-wonPct) + '%;background:var(--red);">' + lost.length + ' lost</div>' : '') +
      '</div>';
    }

    var compRows = state.companies.map(function(co){
      var leads = contactsForCompany(co.id).filter(function(c){ return !c.isLost; });
      var value = leads.reduce(function(s,c){ return s + (Number(c.dealValue)||0); }, 0);
      return {name: co.name, value: value, count: leads.length};
    }).filter(function(r){ return r.count > 0; })
      .sort(function(a,b){ return b.value - a.value; })
      .slice(0,6);
    var compMax = Math.max.apply(null, compRows.map(function(r){ return r.value; }).concat([1]));
    var compHtml = compRows.length
      ? compRows.map(function(r){
          var pct = compMax ? Math.max((r.value/compMax)*100, 4) : 0;
          return '<div class="cbar-row"><div class="cbar-label">' + escapeHtml(r.name) + '</div>' +
            '<div class="cbar-track"><div class="cbar-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="cbar-value">' + fmtMoney(r.value) + '</div></div>';
        }).join('')
      : '<p style="color:var(--muted);font-size:12.5px;margin:0;">Add companies to your leads to see pipeline value by client.</p>';

    // opportunities + time snapshot
    var openOpps = state.opportunities.filter(function(o){ return o.stage!=='won' && o.stage!=='lost'; });
    var openOppValue = openOpps.reduce(function(s,o){ return s+(Number(o.amount)||0); },0);
    var totalHours = state.timeEntries.reduce(function(s,t){ return s+(Number(t.hours)||0); },0);
    var upcomingMeetings = state.meetings.filter(function(m){ return m.status==='scheduled' && m.date >= todayISO(); }).length;

    return '' +
    '<div class="topbar">' +
      '<div><h1>Analytics</h1><p>A high-level read on how leads are moving through HYATT BD Crm right now.</p></div>' +

  /* ===================== calendar tab ===================== */
  function monthMatrix(year, month){
    var firstDay = new Date(year, month, 1);
    var startWeekday = firstDay.getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var daysInPrevMonth = new Date(year, month, 0).getDate();
    var cells = [];
    for(var i=0;i<startWeekday;i++){
      cells.push({day: daysInPrevMonth - startWeekday + 1 + i, other:true, iso:null});
    }
    for(var d=1; d<=daysInMonth; d++){
      cells.push({day:d, other:false, iso: year+'-'+pad2(month+1)+'-'+pad2(d)});
    }
    var nextDay = 1;
    while(cells.length % 7 !== 0){
      cells.push({day: nextDay++, other:true, iso:null});
    }
    return cells;
  }

  function renderCalendarTab(){
    var cells = monthMatrix(state.calYear, state.calMonth);
    var today = todayISO();
    var weekdayHtml = WEEKDAYS.map(function(w){ return '<div>' + w + '</div>'; }).join('');
    var cellsHtml = cells.map(function(cell){
      if(cell.other){
        return '<div class="cal-cell other-month"><div class="cal-daynum">' + cell.day + '</div></div>';
      }
      var dayMeetings = state.meetings.filter(function(m){ return m.date === cell.iso; })
        .sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
      var chips = dayMeetings.slice(0,2).map(function(m){
        return '<div class="cal-chip">' + (m.time ? m.time + ' ' : '') + escapeHtml(m.title) + '</div>';
      }).join('');
      var more = dayMeetings.length > 2 ? '<div class="cal-more">+' + (dayMeetings.length-2) + ' more</div>' : '';
      return '<div class="cal-cell ' + (cell.iso===today?'today':'') + '" data-action="open-day" data-date="' + cell.iso + '">' +
        '<div class="cal-daynum">' + cell.day + '</div>' + chips + more +
      '</div>';
    }).join('');

    return '' +
    '<div class="topbar">' +
      '<div><h1>Calendar</h1><p>Every scheduled meeting and call, laid out by day.</p></div>' +
      '<div class="actions"><button class="btn btn-accent" data-action="open-meeting-modal">+ New Meeting</button></div>' +

      templatesHtml = emptyState('generic', 'No sequences yet', 'Build a multi-step, multi-channel outreach sequence — email, then LinkedIn, then a call.', 'open-sequence-modal', '+ New Sequence');
    } else {
      templatesHtml = state.sequences.map(function(seq){
        var enrolledCount = state.enrollments.filter(function(e){ return e.sequenceId === seq.id && e.status === 'active'; }).length;
        var stepsHtml = seq.steps.map(function(st, i){
          var c = CHANNEL_MAP[st.channel] || CHANNELS[0];
          return (i>0 ? '<span class="seq-arrow">→</span>' : '') +

        return '<div class="seq-card">' +
          '<div class="seq-card-head">' +
            '<div><div class="seq-name">' + escapeHtml(seq.name) + '</div>' + (seq.description ? '<div class="seq-desc">' + escapeHtml(seq.description) + '</div>' : '') + '</div>' +
            '<div style="display:flex;gap:6px;"><button class="btn btn-sm" data-action="open-sequence-modal" data-id="' + seq.id + '">Edit</button></div>' +
          '</div>' +
          (seq.steps.length ? '<div class="seq-steps">' + stepsHtml + '</div>' : '<p style="color:var(--muted);font-size:12px;margin:10px 0 0;">No steps added yet.</p>') +

        '</div>';

      var rows = state.enrollments.slice().sort(function(a,b){
        if(a.status==='active' && b.status!=='active') return -1;
        if(b.status==='active' && a.status!=='active') return 1;
        return (a.nextDueDate||'').localeCompare(b.nextDueDate||'');
      }).map(function(e){
        var c = contactById(e.contactId);
        var seq = sequenceById(e.sequenceId);
        if(!c || !seq) return '';
        var step = seq.steps[e.stepIndex];
        var dueClass = '';
        var dueLabel = '—';
        if(e.status === 'active' && e.nextDueDate){
          dueLabel = fmtDate(e.nextDueDate);

        } else if(e.status === 'completed'){ dueLabel = 'Completed'; }
        else if(e.status === 'paused'){ dueLabel = 'Paused'; }
        else if(e.status === 'stopped'){ dueLabel = 'Stopped'; }

        var actions = '';
        if(e.status === 'active'){
          actions = '<button class="btn btn-sm" data-action="advance-enrollment" data-id="' + e.id + '">Mark step done</button>' +

            '<button class="btn btn-sm btn-danger" data-action="stop-enrollment" data-id="' + e.id + '">Stop</button>';
        } else if(e.status === 'paused'){
          actions = '<button class="btn btn-sm" data-action="resume-enrollment" data-id="' + e.id + '">Resume</button>' +
            '<button class="btn btn-sm btn-danger" data-action="stop-enrollment" data-id="' + e.id + '">Stop</button>';
        }

        return '<tr>' +
          '<td><div class="name-cell">' + escapeHtml(c.name) + '</div><div class="sub-cell">' + escapeHtml(seq.name) + '</div></td>' +
          '<td>Step ' + (e.stepIndex+1) + ' of ' + seq.steps.length + '</td>' +
          '<td>' + (step ? channelPill(step.channel) : '—') + '</td>' +
          '<td class="' + dueClass + '">' + dueLabel + '</td>' +
          '<td><div style="display:flex;gap:6px;flex-wrap:wrap;">' + actions + '</div></td>' +

  function renderContactPanel(){
    var c = contactById(state.panel.id);
    if(!c) return '<div class="backdrop" data-action="close-panel"></div><div class="panel"></div>';
    var comp = companyById(c.companyId);
    var tags = (c.tags||[]).length ? '<div class="tag-row">' + c.tags.map(function(t){ return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>' : '<span style="color:var(--muted)">No tags</span>';

    var stageButtons = STAGES.map(function(s){
      var isCurrent = !c.isLost && c.stage === s.key;
      return '<button class="stage-btn ' + (isCurrent?'current':'') + '" style="' + (isCurrent ? ('background:' + s.color + ';border-color:' + s.color) : '') + '" data-action="set-stage" data-id="' + c.id + '" data-stage="' + s.key + '">' + s.label + '</button>';
    }).join('');

    var enrollment = activeEnrollmentForContact(c.id);
    var seqHtml;
    if(enrollment){
      var seq = sequenceById(enrollment.sequenceId);
      var step = seq ? seq.steps[enrollment.stepIndex] : null;
      var today = todayISO();
      var dueLabel = enrollment.nextDueDate ? fmtDate(enrollment.nextDueDate) : '—';
      var dueClass = '';
      if(enrollment.nextDueDate && enrollment.nextDueDate < today){ dueClass='overdue'; dueLabel = 'Overdue · ' + dueLabel; }
      else if(enrollment.nextDueDate === today){ dueClass='due-today'; dueLabel = 'Due today'; }
      seqHtml = '<div class="fg-value">' + escapeHtml(seq ? seq.name : 'Sequence') + ' — step ' + (enrollment.stepIndex+1) + ' of ' + (seq?seq.steps.length:0) + '</div>' +
        '<div style="margin:6px 0;">' + (step ? channelPill(step.channel) : '') + ' <span class="' + dueClass + '" style="font-size:12px;">' + dueLabel + '</span></div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">' +
          '<button class="btn btn-sm" data-action="advance-enrollment" data-id="' + enrollment.id + '">Mark step done</button>' +
          '<button class="btn btn-sm" data-action="pause-enrollment" data-id="' + enrollment.id + '">Pause</button>' +
          '<button class="btn btn-sm btn-danger" data-action="stop-enrollment" data-id="' + enrollment.id + '">Stop</button>' +
        '</div>';
    } else {
      seqHtml = state.sequences.length
        ? '<div class="fg-value" style="color:var(--muted);margin-bottom:8px;">Not enrolled in a sequence</div><button class="btn btn-sm" data-action="open-enroll-modal" data-id="' + c.id + '">Enroll in a sequence</button>'
        : '<div class="fg-value" style="color:var(--muted);">No sequences yet — <a href="#" data-action="go-tab" data-tab="sequences">create one</a> first.</div>';
    }

    return '' +
    '<div class="backdrop open" data-action="close-panel"></div>' +
    '<div class="panel open">' +
      '<div class="panel-head">' +
        '<div><h2>' + escapeHtml(c.name) + '</h2><div class="ph-sub">' + escapeHtml(c.title || 'Contact') + (comp ? ' at ' + escapeHtml(comp.name) : '') + '</div></div>' +
        '<button class="panel-close" data-action="close-panel">✕</button>' +
      '</div>' +
      '<div class="panel-body">' +
        (c.isLost ? '<div style="background:#331813;border:1px solid #4A241D;color:#FF6B52;padding:9px 12px;border-radius:6px;font-size:12.5px;font-weight:600;margin-bottom:18px;">Marked as lost</div>' : '') +
        '<div class="field-group"><div class="fg-label">Stage</div><div class="stage-select-row">' + stageButtons + '</div></div>' +
        '<div class="field-group"><div class="fg-label">Sequence</div>' + seqHtml + '</div>' +
        '<div class="field-group"><div class="fg-label">Company</div><div class="fg-value">' +
          (comp ? '<a href="#" data-action="open-company-panel" data-id="' + comp.id + '">' + escapeHtml(comp.name) + '</a>' : '<span style="color:var(--muted)">No company linked</span>') +

        '<div class="field-group"><div class="fg-label">LinkedIn</div><div class="fg-value">' + (c.linkedin ? '<a href="' + escapeHtml(c.linkedin) + '" target="_blank" rel="noopener">' + escapeHtml(c.linkedin) + '</a>' : '<span style="color:var(--muted)">Not added</span>') + '</div></div>' +

        '<div class="field-group"><div class="fg-label">Tags</div>' + tags + '</div>' +
        '<div class="field-group"><div class="fg-label">Notes</div><div class="fg-value" style="white-space:pre-wrap;color:var(--ink-soft)">' + (c.notes ? escapeHtml(c.notes) : '<span style="color:var(--muted)">No notes yet</span>') + '</div></div>' +

      '</div>' +

  var draggedId = null;

  function attachHandlers(){
    app.addEventListener('click', onClick);

    bindInput('contact-search', function(v){ state.contactSearch = v; }, true);
    bindSelect('contact-filter', function(v){ state.contactFilter = v; });
    bindInput('company-search', function(v){ state.companySearch = v; }, true);
    bindInput('meeting-search', function(v){ state.meetingSearch = v; }, true);
    bindSelect('meeting-filter', function(v){ state.meetingFilter = v; });
    bindInput('conv-search', function(v){ state.convSearch = v; }, true);
    bindSelect('conv-filter', function(v){ state.convFilter = v; });
    bindInput('opp-search', function(v){ state.oppSearch = v; }, true);
    bindSelect('opp-filter', function(v){ state.oppFilter = v; });
    bindInput('hotel-search', function(v){ state.hotelSearch = v; }, true);
    bindSelect('hotel-brand-filter', function(v){ state.hotelBrandFilter = v; });
    bindSelect('hotel-build-filter', function(v){ state.hotelBuildFilter = v; });

    var fileInput = app.querySelector('[data-role="import-file"]');
    if(fileInput){
      fileInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        var isExcel = /\.(xlsx|xls)$/i.test(file.name);
        var reader = new FileReader();
        reader.onload = function(ev){
          var rows;
          try{
            if(isExcel){
              if(typeof XLSX === 'undefined'){ alert('Excel support failed to load. Please try a CSV file instead.'); return; }
              var wb = XLSX.read(ev.target.result, {type:'array'});
              var firstSheet = wb.Sheets[wb.SheetNames[0]];
              rows = XLSX.utils.sheet_to_json(firstSheet, {header:1, raw:false, defval:''})
                .map(function(r){ return r.map(function(v){ return v==null ? '' : String(v); }); })
                .filter(function(r){ return r.some(function(v){ return String(v).trim() !== ''; }); });
            } else {
              rows = parseCSV(String(ev.target.result || ''));
            }
          } catch(err){
            alert('Could not read that file. Please check the format and try again.');
            return;
          }
          if(!rows.length){ alert('That file looks empty.'); return; }
          var headers = rows[0];
          var dataRows = rows.slice(1);
          var currentType = state.importState.importType || 'contacts';
          var mapping = guessImportMapping(headers, currentType === 'hotels' ? HOTEL_IMPORT_FIELDS : IMPORT_FIELDS);
          state.importState = {
            step:'map', importType: currentType, fileName: file.name, headers: headers, rows: dataRows, mapping: mapping
          };
          render();
        };
        reader.onerror = function(){ alert('Could not read that file. Please try again.'); };
        if(isExcel) reader.readAsArrayBuffer(file);
        else reader.readAsText(file);
      });
    }
    app.querySelectorAll('[data-role="import-mapping"]').forEach(function(sel){
      sel.addEventListener('change', function(e){
        state.importState.mapping[sel.getAttribute('data-field')] = Number(e.target.value);
        render();
      });
    });

    app.querySelectorAll('.kcard').forEach(function(card){
      card.addEventListener('dragstart', function(e){
        draggedId = card.getAttribute('data-id');
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
    });
    app.querySelectorAll('.kcol-body').forEach(function(col){
      col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('dragover'); });
      col.addEventListener('dragleave', function(){ col.classList.remove('dragover'); });
      col.addEventListener('drop', function(e){
        e.preventDefault();
        col.classList.remove('dragover');
        if(!draggedId) return;
        var stage = col.getAttribute('data-stage');
        var contact = contactById(draggedId);
        if(contact){
          contact.stage = stage;
          contact.isLost = false;
          saveContacts();
          render();
        }
        draggedId = null;
      });
    });
  }

    });

  function bindSelect(id, setter){
    var el = document.getElementById(id);

    el.addEventListener('change', function(e){ setter(e.target.value); render(); });

  function renderPreserveFocus(focusId){
    var scrollY = window.scrollY;
    var el = document.getElementById(focusId);
    var pos = el ? el.selectionStart : null;
    render();
    var newEl = document.getElementById(focusId);
    if(newEl){ newEl.focus(); if(pos!=null && newEl.setSelectionRange) newEl.setSelectionRange(pos,pos); }
    window.scrollTo(0, scrollY);
  }

  function onClick(e){

    var id = el.getAttribute('data-id');

    switch(action){
      case 'go-tab':
        state.tab = el.getAttribute('data-tab');
        state.panel = null;

      case 'open-contact-panel':

        break;

        e.preventDefault();
        state.panel = {type:'company', id: id};
        render();
        break;
      case 'close-panel':

        render();
        break;

      case 'open-contact-modal':
        state.modal = {type:'contact', data:{}};
        render();
        break;
      case 'open-company-modal':
        state.modal = {type:'company', data:{}};
        render();
        break;
      case 'edit-contact':
        state.modal = {type:'contact', data: Object.assign({}, contactById(id))};
        render();
        break;
      case 'edit-company':
        state.modal = {type:'company', data: Object.assign({}, companyById(id))};
        render();
        break;

      case 'open-meeting-modal': {
        var mData = id ? Object.assign({}, meetingById(id)) : {status:'scheduled', duration:30};
        var presetDate = el.getAttribute('data-date');
        if(presetDate && !id) mData.date = presetDate;
        state.modal = {type:'meeting', data: mData};
        render();
        break;
      }
      case 'edit-meeting-from-day':
        state.modal = {type:'meeting', data: Object.assign({}, meetingById(id))};
        render();
        break;

      case 'open-time-modal':
        state.modal = {type:'timeEntry', data: id ? Object.assign({}, timeEntryById(id)) : {}};
        render();
        break;
      case 'open-opportunity-modal':
        state.modal = {type:'opportunity', data: id ? Object.assign({}, opportunityById(id)) : {stage:'discovery', probability:50}};
        render();
        break;
      case 'open-conversation-modal':
        state.modal = {type:'conversation', data: id ? Object.assign({}, conversationById(id)) : {type:'call'}};
        render();
        break;
      case 'open-workflow-modal':
        state.modal = {type:'workflow', data: id ? Object.assign({}, workflowById(id)) : {}};
        render();
        break;
      case 'open-sequence-modal': {
        var existingSeq = id ? sequenceById(id) : null;
        state.modal = {type:'sequence', data: existingSeq ? JSON.parse(JSON.stringify(existingSeq)) : {steps:[]}};
        render();
        break;
      }
      case 'open-enroll-modal':
        state.modal = {type:'enroll', data: {contactId: id}};
        render();
        break;
      case 'add-seq-step':
        syncSeqStepsFromDOM();
        state.modal.data.steps.push({channel:'email', delayDays: state.modal.data.steps.length ? 2 : 0, subject:'', message:''});
        render();
        break;
      case 'remove-seq-step':

        render();

      case 'open-day':

      case 'save-company': saveCompanyFromForm(id); break;
      case 'save-meeting': saveMeetingFromForm(id); break;

        var w = workflowById(id);
        if(w){ w.active = !w.active; saveWorkflows(); render(); }

        if(confirm('Delete this contact? This cannot be undone.')){
          state.contacts = state.contacts.filter(function(x){ return x.id !== id; });
          saveContacts(); state.panel = null; render();
        }
        break;
      case 'delete-company':
        if(confirm('Delete this company? Contacts linked to it will remain but lose the company link.')){
          state.companies = state.companies.filter(function(x){ return x.id !== id; });
          state.contacts.forEach(function(c){ if(c.companyId === id) c.companyId = null; });
          saveCompanies(); saveContacts(); state.panel = null; render();
        }
        break;
      case 'delete-meeting':
        if(confirm('Delete this meeting?')){
          state.meetings = state.meetings.filter(function(x){ return x.id !== id; });
          saveMeetings(); state.modal = null; render();
        }
        break;
      case 'delete-time-entry':
        if(confirm('Delete this time entry?')){
          state.timeEntries = state.timeEntries.filter(function(x){ return x.id !== id; });
          saveTimeEntries(); state.modal = null; render();
        }
        break;
      case 'delete-opportunity':
        if(confirm('Delete this opportunity?')){
          state.opportunities = state.opportunities.filter(function(x){ return x.id !== id; });
          saveOpportunities(); state.modal = null; render();
        }
        break;
      case 'delete-conversation':
        if(confirm('Delete this conversation entry?')){
          state.conversations = state.conversations.filter(function(x){ return x.id !== id; });
          saveConversations(); state.modal = null; render();
        }
        break;
      case 'delete-workflow':
        if(confirm('Delete this workflow?')){
          state.workflows = state.workflows.filter(function(x){ return x.id !== id; });
          saveWorkflows(); state.modal = null; render();
        }
        break;
      case 'delete-sequence':
        if(confirm('Delete this sequence? Contacts currently enrolled will be stopped.')){
          state.sequences = state.sequences.filter(function(x){ return x.id !== id; });
          state.enrollments.forEach(function(e){ if(e.sequenceId === id && e.status === 'active') e.status = 'stopped'; });
          saveSequences(); saveEnrollments(); state.modal = null; render();
        }
        break;
      case 'delete-hotel':
        if(confirm('Delete this property? This cannot be undone.')){
          state.hotels = state.hotels.filter(function(x){ return x.id !== id; });
          saveHotels(); state.modal = null; render();
        }
        break;
      case 'advance-enrollment': advanceEnrollment(id); break;
      case 'pause-enrollment': {
        var enrP = enrollmentById(id);
        if(enrP){ enrP.status = 'paused'; saveEnrollments(); render(); }
        break;
      }
      case 'resume-enrollment': {
        var enrR = enrollmentById(id);
        if(enrR){ enrR.status = 'active'; enrR.nextDueDate = todayISO(); saveEnrollments(); render(); }
        break;
      }
      case 'stop-enrollment': {
        var enrS = enrollmentById(id);
        if(enrS){ enrS.status = 'stopped'; saveEnrollments(); render(); }
        break;
      }

      case 'cal-prev':
        state.calMonth--; if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
        render();
        break;
      case 'cal-next':
        state.calMonth++; if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
        render();
        break;
      case 'cal-today':
        var n = new Date(); state.calYear = n.getFullYear(); state.calMonth = n.getMonth();
        render();
        break;

      case 'export-data':
        exportAllData();
        break;
      case 'clear-all-data':
        if(confirm('This will permanently delete every contact, company, meeting, opportunity, and log in this CRM. Continue?')){
          clearAllData();
        }
        break;
    }
  }

  function cellAt(row, idx){ return (idx!=null && idx > -1 && row[idx]!=null) ? String(row[idx]).trim() : ''; }
  function parseNumberLoose(str){
    if(!str) return 0;
    var n = parseFloat(String(str).replace(/[^0-9.\-]/g, ''));
    return isNaN(n) ? 0 : n;
  }
  function normalizeDateStr(raw){
    if(!raw) return '';
    if(/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
    var d = new Date(raw);
    if(isNaN(d.getTime())) return '';
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function matchStageKey(raw, stageList, fallback){
    if(!raw) return fallback;
    var norm = normalizeHeader(raw);
    var hit = stageList.find(function(s){
      return normalizeHeader(s.label) === norm || normalizeHeader(s.key) === norm ||
        normalizeHeader(s.label).indexOf(norm) !== -1 || norm.indexOf(normalizeHeader(s.key)) !== -1;
    });
    return hit ? hit.key : fallback;
  }
  function matchBuildType(raw){
    if(!raw) return 'new';
    var norm = normalizeHeader(raw);
    return norm.indexOf('conv') !== -1 ? 'conversion' : 'new';
  }
  function parseBoolLoose(raw){
    if(!raw) return false;
    var norm = String(raw).trim().toLowerCase();
    return norm === 'yes' || norm === 'y' || norm === 'true' || norm === '1' || norm === 'x';
  }

  function runImport(){
    var s = state.importState;
    var map = s.mapping;

    if(s.importType === 'hotels'){
      var hotelsCreated = 0, hotelsSkipped = 0;
      s.rows.forEach(function(row){
        var propertyCode = cellAt(row, map.propertyCode);
        var name = cellAt(row, map.name);
        if(!propertyCode || !name){ hotelsSkipped++; return; }
        state.hotels.push({
          id: uid('htl'),
          propertyCode: propertyCode,
          name: name,
          brand: cellAt(row, map.brand),
          buildType: matchBuildType(cellAt(row, map.buildType)),
          country: cellAt(row, map.country),
          state: cellAt(row, map.state),
          dateAssigned: normalizeDateStr(cellAt(row, map.dateAssigned)),
          bdm1: cellAt(row, map.bdm1),
          bdm2: cellAt(row, map.bdm2),
          originalOpeningDate: normalizeDateStr(cellAt(row, map.originalOpeningDate)),
          currentOpeningDate: normalizeDateStr(cellAt(row, map.currentOpeningDate)),
          beginSellingDate: normalizeDateStr(cellAt(row, map.beginSellingDate)),
          preOpenOutputDate: normalizeDateStr(cellAt(row, map.preOpenOutputDate)),
          postOps45Date: normalizeDateStr(cellAt(row, map.postOps45Date)),
          postOps90Date: normalizeDateStr(cellAt(row, map.postOps90Date)),
          marketEngageStart1: normalizeDateStr(cellAt(row, map.marketEngageStart1)),
          marketEngageEnd1: normalizeDateStr(cellAt(row, map.marketEngageEnd1)),
          bdmTravelling: parseBoolLoose(cellAt(row, map.bdmTravelling)),
          marketEngageStart2: normalizeDateStr(cellAt(row, map.marketEngageStart2)),
          marketEngageEnd2: normalizeDateStr(cellAt(row, map.marketEngageEnd2)),
          notes: cellAt(row, map.notes),
          createdAt: new Date().toISOString()
        });
        hotelsCreated++;
      });
      saveHotels();
      state.importState = {step:'done', importType:'hotels', result:{hotels:hotelsCreated, skipped:hotelsSkipped}};
      render();
      return;
    }

    var contactsCreated = 0, companiesCreated = 0, opportunitiesCreated = 0, skipped = 0;

    s.rows.forEach(function(row){
      var name = cellAt(row, map.name);
      if(!name){ skipped++; return; }

      var companyName = cellAt(row, map.companyName);
      var companyId = null;
      if(companyName){
        var existingCo = state.companies.find(function(c){ return c.name.toLowerCase() === companyName.toLowerCase(); });
        if(existingCo){ companyId = existingCo.id; }
        else {
          var newCo = {id: uid('co'), name: companyName, industry:'', size:'', website:'', notes:'', createdAt: new Date().toISOString()};
          state.companies.push(newCo);
          companyId = newCo.id;
          companiesCreated++;
        }
      }

      var stageRaw = cellAt(row, map.stage);
      var dealValueRaw = cellAt(row, map.dealValue);
      var dealValue = parseNumberLoose(dealValueRaw);
      var probabilityRaw = cellAt(row, map.probability);
      var closeDateRaw = cellAt(row, map.closeDate);

      var newContact = {
        id: uid('lead'),
        name: name,
        title: cellAt(row, map.title),
        companyId: companyId,
        email: cellAt(row, map.email),
        phone: cellAt(row, map.phone),
        linkedin: cellAt(row, map.linkedin),
        stage: matchStageKey(stageRaw, STAGES, 'new'),
        dealValue: dealValue,
        tags: [],
        notes: cellAt(row, map.notes),
        isLost: false,
        createdAt: new Date().toISOString()
      };
      state.contacts.push(newContact);
      contactsCreated++;

      // A row that carries deal-specific info also opens a linked opportunity,
      // so the same import feeds the Opportunities tab automatically.
      if(dealValueRaw || probabilityRaw || closeDateRaw){
        state.opportunities.push({
          id: uid('opp'),
          name: name + (companyName ? ' — ' + companyName : ''),
          contactId: newContact.id,
          amount: dealValue,
          probability: probabilityRaw ? Math.max(0, Math.min(100, parseNumberLoose(probabilityRaw))) : 50,
          stage: matchStageKey(stageRaw, OPP_STAGES, 'discovery'),
          closeDate: normalizeDateStr(closeDateRaw),
          notes: cellAt(row, map.notes),
          createdAt: new Date().toISOString()
        });
        opportunitiesCreated++;
      }
    });

    saveContacts();
    if(companiesCreated) saveCompanies();
    if(opportunitiesCreated) saveOpportunities();

    state.importState = {
      step:'done',
      importType:'contacts',
      result:{contacts:contactsCreated, companies:companiesCreated, opportunities:opportunitiesCreated, skipped:skipped}
    };
    render();
  }

  function exportAllData(){
    var payload = {
      contacts: state.contacts, companies: state.companies, meetings: state.meetings,
      timeEntries: state.timeEntries, opportunities: state.opportunities,
      conversations: state.conversations, workflows: state.workflows,
      sequences: state.sequences, enrollments: state.enrollments, hotels: state.hotels,
      settings: state.settings,
      exportedAt: new Date().toISOString()
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'hyatt-bd-crm-export.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function clearAllData(){
    state.contacts = []; state.companies = []; state.meetings = []; state.timeEntries = [];
    state.opportunities = []; state.conversations = []; state.workflows = [];
    state.sequences = []; state.enrollments = []; state.hotels = [];
    state.settings = {workspaceName:'HYATT BD Crm', currency:'USD'};
    saveContacts(); saveCompanies(); saveMeetings(); saveTimeEntries();
    saveOpportunities(); saveConversations(); saveWorkflows();
    saveSequences(); saveEnrollments(); saveHotels(); saveSettings();
    state.panel = null; state.modal = null;
    render();
  }

  /* ===================== init ===================== */
  loadData().then(render);
})();
</script>
</body>
</html>
